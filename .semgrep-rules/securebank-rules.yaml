rules:
  - id: python.sqlalchemy.security.sqlalchemy-execute-raw-query
    languages: [python]
    severity: ERROR
    message: >-
      Detected string concatenation/formatting in a SQL query — use
      parameterized queries instead.
    metadata:
      cwe: "CWE-89: Improper Neutralization of Special Elements used in an SQL Command"
      owasp: "A03:2021 - Injection"
      category: security
      confidence: HIGH
    patterns:
      - pattern-either:
          - pattern: $CUR.execute("..." + $X + "...")
          - pattern: $CUR.execute(f"...{$X}...")
          - pattern: |
              $Q = "..." + $X + "..."
              ...
              $CUR.execute($Q)
    paths:
      include: ["*.py"]

  - id: python.lang.security.audit.dangerous-system-call
    languages: [python]
    severity: ERROR
    message: >-
      Found dynamic content in a call to os.system(). This is
      dangerous if external data can reach this function call because
      it allows a malicious actor to execute commands. Consider using
      subprocess.run() with shell=False instead.
    metadata:
      cwe: "CWE-78: Improper Neutralization of Special Elements used in an OS Command"
      owasp: "A03:2021 - Injection"
      category: security
      confidence: HIGH
    patterns:
      - pattern: os.system("..." + $X)
    paths:
      include: ["*.py"]

  - id: python.flask.security.audit.unescaped-template-string
    mode: taint
    languages: [python]
    severity: WARNING
    message: >-
      User-controlled data is interpolated into an HTML response
      without escaping. This can lead to Cross-Site Scripting (XSS).
      Use markupsafe.escape() before interpolating into HTML.
    metadata:
      cwe: "CWE-79: Improper Neutralization of Input During Web Page Generation (XSS)"
      owasp: "A03:2021 - Injection"
      category: security
      confidence: MEDIUM
    pattern-sources:
      - patterns:
          - pattern-either:
              - pattern: request.args.get(...)
              - pattern: request.args[...]
    pattern-sanitizers:
      - pattern: escape(...)
    pattern-sinks:
      - patterns:
          - pattern: f"...{$X}..."
    paths:
      include: ["*.py"]

  - id: python.lang.security.audit.md5-used-as-password
    languages: [python]
    severity: ERROR
    message: >-
      Detected use of hashlib.md5() to hash a password. MD5 is not
      considered a secure password hashing algorithm. Use bcrypt,
      scrypt, or argon2 with a random salt instead.
    metadata:
      cwe: "CWE-327: Use of a Broken or Risky Cryptographic Algorithm"
      cwe2: "CWE-916: Use of Password Hash With Insufficient Computational Effort"
      owasp: "A02:2021 - Cryptographic Failures"
      category: security
      confidence: HIGH
    patterns:
      - pattern: hashlib.md5(...)
    paths:
      include: ["*.py"]

  - id: python.lang.security.audit.eval-detected
    languages: [python]
    severity: ERROR
    message: >-
      Detected the use of eval(). eval() can be dangerous if used to
      evaluate dynamic content. If this content can be input from
      outside the program, this may be a code injection
      vulnerability. Use ast.literal_eval() or a restricted parser
      instead.
    metadata:
      cwe: "CWE-95: Improper Neutralization of Directives in Dynamically Evaluated Code"
      owasp: "A03:2021 - Injection"
      category: security
      confidence: HIGH
    patterns:
      - pattern: eval(...)
      - pattern-not: ast.literal_eval(...)
    paths:
      include: ["*.py"]
