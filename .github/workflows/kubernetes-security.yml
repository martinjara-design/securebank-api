name: Kubernetes Security - Sesion 12

on:
  push:
    branches:
      - feature/sesion-12-kubernetes-security
  pull_request:
    branches:
      - main
    paths:
      - k8s/**
      - scripts/render_k8s.py
      - scripts/setup_k8s_lab.sh
      - scripts/check_k8s_network.py
      - docker/Dockerfile.v2
      - requirements.txt
      - .github/workflows/kubernetes-security.yml

permissions:
  contents: read

jobs:
  kubernetes-lab:
    name: Desplegar y comprobar hardening
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Preparar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Instalar Kind y kubectl
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p "$RUNNER_TEMP/k8s-tools"
          cd "$RUNNER_TEMP/k8s-tools"

          curl -fsSL \
            https://github.com/kubernetes-sigs/kind/releases/download/v0.30.0/kind-linux-amd64 \
            -o kind-linux-amd64

          curl -fsSL \
            https://github.com/kubernetes-sigs/kind/releases/download/v0.30.0/kind-linux-amd64.sha256sum \
            -o kind-linux-amd64.sha256sum

          sha256sum -c kind-linux-amd64.sha256sum
          sudo install -m 0755 kind-linux-amd64 /usr/local/bin/kind

          curl -fsSL \
            https://dl.k8s.io/release/v1.34.0/bin/linux/amd64/kubectl \
            -o kubectl

          curl -fsSL \
            https://dl.k8s.io/release/v1.34.0/bin/linux/amd64/kubectl.sha256 \
            -o kubectl.sha256

          printf '%s  %s\n' "$(cat kubectl.sha256)" kubectl \
            | sha256sum -c -

          sudo install -m 0755 kubectl /usr/local/bin/kubectl

      - name: Preparar cluster registro y Calico
        run: bash scripts/setup_k8s_lab.sh

      - name: Construir y publicar en registro local
        shell: bash
        env:
          COMMIT_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail

          IMAGE="localhost:5001/securebank-api:$COMMIT_SHA"

          docker build \
            -f docker/Dockerfile.v2 \
            -t "$IMAGE" .

          docker push "$IMAGE"

          REFERENCE=$(docker image inspect \
            --format '{{index .RepoDigests 0}}' "$IMAGE")

          printf '%s\n' "$REFERENCE" \
            > reports/k8s/image-digest.txt

          python scripts/render_k8s.py \
            "$REFERENCE" \
            reports/k8s/deployment.hardened.yaml

            - name: Analizar Deployment con Kubesec
        shell: bash
        run: |
          set -euo pipefail

          docker run --rm -i \
            kubesec/kubesec:v2.14.2 \
            scan /dev/stdin \
            < reports/k8s/deployment.hardened.yaml \
            > reports/k8s/kubesec.json

          cat reports/k8s/kubesec.json

          python - <<'PY'
          import json
          from pathlib import Path

          results = json.loads(
              Path("reports/k8s/kubesec.json").read_text()
          )

          if not isinstance(results, list) or not results:
              raise SystemExit("Kubesec no devolvio resultados validos")

          for result in results:
              if result.get("valid") is not True:
                  raise SystemExit("Kubesec considera invalido el manifiesto")

              if result.get("score", -1) < 0:
                  raise SystemExit("Kubesec detecto una puntuacion negativa")

          print("PASS: manifiesto valido y sin puntuacion negativa")
          PY

      - name: Crear Namespace e identidad
        run: kubectl apply -f k8s/hardened/namespace.yaml

      - name: Crear secreto temporal
        shell: bash
        run: |
          set -euo pipefail

          SECRET_FILE=$(mktemp "$RUNNER_TEMP/securebank-jwt.XXXXXX")
          trap 'rm -f "$SECRET_FILE"' EXIT

          JWT=$(openssl rand -hex 32)
          echo "::add-mask::$JWT"
          printf '%s' "$JWT" > "$SECRET_FILE"

          kubectl -n securebank create secret generic \
            securebank-secrets \
            --from-file="jwt-secret=$SECRET_FILE"

      - name: Validar y aplicar manifiestos
        run: |
          kubectl apply --dry-run=server \
            -f reports/k8s/deployment.hardened.yaml

          kubectl apply \
            -f reports/k8s/deployment.hardened.yaml

          kubectl apply -f k8s/hardened/service.yaml
          kubectl apply -f k8s/hardened/networkpolicy.yaml

      - name: Esperar Deployment disponible
        shell: bash
        run: |
          set -euo pipefail

          kubectl -n securebank rollout status \
            deployment/securebank-api \
            --timeout=180s \
            2>&1 | tee reports/k8s/rollout.txt

      - name: Comprobar salud de la API
        run: |
          kubectl -n securebank exec \
            deployment/securebank-api -- \
            python -c \
            "import urllib.request; print(urllib.request.urlopen('http://127.0.0.1:8080/health', timeout=5).read().decode())" \
            > reports/k8s/health.json

          cat reports/k8s/health.json

      - name: Comprobar hardening en ejecucion
        shell: bash
        run: |
          set -euo pipefail

          kubectl -n securebank exec -i \
            deployment/securebank-api -- python - <<'PY' \
            | tee reports/k8s/runtime-checks.json
          import json
          import os
          import tempfile
          from pathlib import Path

          status = {}

          for line in Path("/proc/self/status").read_text().splitlines():
              if ":" in line:
                  key, value = line.split(":", 1)
                  status[key] = value.strip()

          root_readonly = False

          for line in Path("/proc/self/mountinfo").read_text().splitlines():
              fields = line.split()
              if fields[4] == "/":
                  root_readonly = "ro" in fields[5].split(",")

          with tempfile.TemporaryFile(dir="/tmp") as temporary:
              temporary.write(b"hardening-check")

          checks = {
              "uid_10001": os.getuid() == 10001,
              "gid_10001": os.getgid() == 10001,
              "serviceaccount_token_absent": not Path(
                  "/var/run/secrets/kubernetes.io/serviceaccount/token"
              ).exists(),
              "effective_capabilities_zero": int(
                  status["CapEff"], 16
              ) == 0,
              "no_new_privileges": status["NoNewPrivs"] == "1",
              "seccomp_filter_active": status["Seccomp"] == "2",
              "root_filesystem_readonly": root_readonly,
              "tmp_writable": True,
          }

          print(json.dumps(checks, indent=2))

          if not all(checks.values()):
              raise SystemExit("Fallo una comprobacion de hardening")
          PY

      - name: Comprobar NetworkPolicy de entrada
        shell: bash
        run: |
          set -euo pipefail

          python scripts/check_k8s_network.py 2>&1 \
            | tee reports/k8s/network-test.log

      - name: Guardar estado y diagnosticos
        if: always()
        shell: bash
        run: |
          mkdir -p reports/k8s

          kubectl --request-timeout=10s -n securebank \
            get pods -o wide \
            > reports/k8s/pods.txt 2>&1 || true

          kubectl --request-timeout=10s -n securebank \
            get deployment securebank-api -o yaml \
            > reports/k8s/deployment-live.yaml 2>&1 || true

          kubectl --request-timeout=10s -n securebank \
            describe pods \
            > reports/k8s/pod-details.txt 2>&1 || true

          kubectl --request-timeout=10s -n securebank \
            logs deployment/securebank-api \
            > reports/k8s/application.log 2>&1 || true

          kubectl --request-timeout=10s -n kube-system \
            get pods -o wide \
            > reports/k8s/system-pods-final.txt 2>&1 || true

      - name: Guardar evidencias
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: kubernetes-lab
          path: reports/k8s/
          retention-days: 14
          if-no-files-found: error

      - name: Eliminar laboratorio
        if: always()
        run: |
          kind delete cluster --name securebank || true
          docker rm -f securebank-registry || true
