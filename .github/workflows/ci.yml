name: SecureBank API · CI v1.2

on:
  push:
    branches: [main, "feature/**"]
  pull_request:
    branches: [main]

permissions:
  contents: read

env:
  PYTHON_VERSION: "3.11"

jobs:
  secret-scan:
    name: Secret Scan (Gitleaks)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install Gitleaks
        shell: bash
        run: |
          set -euo pipefail
          V=8.30.1
          F="gitleaks_${V}_linux_x64.tar.gz"
          curl -sSfL -o "$F" \
            "https://github.com/gitleaks/gitleaks/releases/download/v${V}/${F}"
          curl -sSfL -o gl.sum \
            "https://github.com/gitleaks/gitleaks/releases/download/v${V}/gitleaks_${V}_checksums.txt"
          grep "$F" gl.sum | sha256sum -c -
          tar xzf "$F" gitleaks
          sudo install gitleaks /usr/local/bin/gitleaks

      - name: Detectar secretos
        run: |
          gitleaks detect --source . \
            -c .gitleaks.toml --redact -v \
            --report-format sarif \
            --report-path gitleaks.sarif

      - name: Guardar reporte de secretos
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gitleaks-report-${{ github.sha }}
          path: gitleaks.sarif
          retention-days: 7
          if-no-files-found: error

  build-test:
    name: Build & Unit Tests
    needs: secret-scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip

      - name: Instalar dependencias
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Comprobar sintaxis
        run: python -m compileall -q securebank_api scripts

      - name: Ejecutar pruebas y medir cobertura
        run: |
          pytest tests/ -v \
            --cov=securebank_api \
            --cov-report=xml \
            --cov-report=term \
            --junitxml=test-results.xml

      - name: Guardar resultados
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results-${{ github.sha }}
          path: |
            test-results.xml
            coverage.xml
          retention-days: 7
          if-no-files-found: error

  sast:
    name: SAST (Semgrep)
    needs: build-test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Instalar Semgrep
        run: pip install -r requirements-sast.txt

      - name: Ejecutar SAST
        run: |
          semgrep \
            --config=.semgrep-rules/securebank-rules.yaml \
            --error \
            --sarif -o sast.sarif \
            securebank_api/

      - name: Guardar reporte SAST
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sast-report-${{ github.sha }}
          path: sast.sarif
          retention-days: 7
          if-no-files-found: error

      - name: Publicar en code scanning
        if: always()
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: sast.sarif

  sca:
    name: SCA + SBOM (Trivy) · policy CVSS
    needs: sast
    runs-on: ubuntu-latest
    outputs:
      blocked: ${{ steps.gate.outputs.blocked }}
      needs_approval: ${{ steps.gate.outputs.needs_approval }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Generar SBOM CycloneDX
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p reports

          python -m venv --without-pip /tmp/rt
          python -m pip --python /tmp/rt/bin/python install \
            --quiet -r requirements.txt

          python -m venv /tmp/sbomtool
          /tmp/sbomtool/bin/pip install \
            --quiet "cyclonedx-bom==8.0.1"

          /tmp/sbomtool/bin/cyclonedx-py environment /tmp/rt \
            --spec-version 1.5 \
            --output-format JSON \
            --output-reproducible \
            --output-file reports/securebank-sbom.cdx.json

      - name: Analizar vulnerabilidades con Trivy
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25
        with:
          scan-type: sbom
          scan-ref: reports/securebank-sbom.cdx.json
          format: json
          output: reports/securebank-vulns.json
          exit-code: "0"

      - name: Policy gate CVSS
        id: gate
        run: |
          python scripts/cvss_gate.py \
            reports/securebank-vulns.json \
            --sbom reports/securebank-sbom.cdx.json \
            --out reports/securebank-vulns.md \
            --html reports/securebank-vulns.html

      - name: Guardar reportes SCA
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sca-reports-${{ github.sha }}
          path: |
            reports/securebank-sbom.cdx.json
            reports/securebank-vulns.json
            reports/securebank-vulns.md
            reports/securebank-vulns.html
          retention-days: 7
          if-no-files-found: error

  dast:
    name: DAST y BOLA
    needs: build-test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Generar secretos temporales
        shell: bash
        run: |
          for VARIABLE in \
            SECUREBANK_JWT_SECRET \
            SECUREBANK_DEMO_ALICE_PASSWORD \
            SECUREBANK_DEMO_BOB_PASSWORD
          do
            VALUE=$(openssl rand -hex 32)
            echo "::add-mask::$VALUE"
            echo "$VARIABLE=$VALUE" >> "$GITHUB_ENV"
          done

      - name: Preparar evidencias
        run: |
          mkdir -p reports/dast
          chmod 777 reports/dast

      - name: Levantar API
        run: docker compose up -d --build

      - name: Esperar a la API
        shell: bash
        run: |
          for intento in {1..30}; do
            if curl --fail --silent \
              http://localhost:8080/health
            then
              exit 0
            fi
            sleep 2
          done
          docker compose logs
          exit 1

      - name: Comprobar BOLA
        shell: bash
        run: |
          set -euo pipefail
          python scripts/bola_check.py 2>&1 \
            | tee reports/dast/bola-results.txt

      - name: Registrar version y fecha de ZAP
        run: |
          docker pull ghcr.io/zaproxy/zaproxy:stable
          date -u +"%Y-%m-%dT%H:%M:%SZ" \
            > reports/dast/fecha.txt

          docker image inspect \
            --format '{{index .RepoDigests 0}}' \
            ghcr.io/zaproxy/zaproxy:stable \
            > reports/dast/imagen-zap.txt

          docker run --rm ghcr.io/zaproxy/zaproxy:stable \
            zap.sh -version \
            > reports/dast/version-zap.txt

      - name: Ejecutar ZAP Baseline
        run: |
          docker run --rm --network host \
            -v "$PWD/reports/dast:/zap/wrk:rw" \
            ghcr.io/zaproxy/zaproxy:stable \
            zap-baseline.py \
            -t "http://127.0.0.1:8080/welcome?name=DAST" \
            -r report.html \
            -J report.json \
            -I

      - name: Guardar reporte DAST
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ci-dast-report-${{ github.sha }}
          path: reports/dast/
          retention-days: 7
          if-no-files-found: error

      - name: Apagar entorno
        if: always()
        run: docker compose down -v

  security-gate:
    name: Security Gate (OPA)
    needs: [secret-scan, build-test, sast, sca, dast]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Descargar reporte de secretos
        uses: actions/download-artifact@v4
        with:
          name: gitleaks-report-${{ github.sha }}
          path: gate-reports/secrets

      - name: Descargar cobertura
        uses: actions/download-artifact@v4
        with:
          name: test-results-${{ github.sha }}
          path: gate-reports/tests

      - name: Descargar SAST
        uses: actions/download-artifact@v4
        with:
          name: sast-report-${{ github.sha }}
          path: gate-reports/sast

      - name: Descargar SCA
        uses: actions/download-artifact@v4
        with:
          name: sca-reports-${{ github.sha }}
          path: gate-reports/sca

      - name: Descargar DAST
        uses: actions/download-artifact@v4
        with:
          name: ci-dast-report-${{ github.sha }}
          path: gate-reports/dast

      - name: Normalizar reportes del mismo run
        run: |
          mkdir -p gate-output
          python scripts/gate_input.py gate-reports \
            > gate-output/input.json
          cat gate-output/input.json

      - name: Ejecutar pruebas de politica
        run: |
          docker run --rm \
            -v "$PWD:/work:ro" \
            openpolicyagent/opa:1.0.0-static \
            test \
            /work/policies/security-policy-v1.rego \
            /work/policies/security-policy-v1_test.rego \
            -v

      - name: Registrar decision y motivos
        run: |
          docker run --rm \
            -v "$PWD:/work:ro" \
            openpolicyagent/opa:1.0.0-static \
            eval \
            --format pretty \
            -d /work/policies/security-policy-v1.rego \
            -i /work/gate-output/input.json \
            'data.securepipeline.gate' \
            > gate-output/decision.txt

          cat gate-output/decision.txt

      - name: Bloquear si la politica no permite continuar
        run: |
          docker run --rm \
            -v "$PWD:/work:ro" \
            openpolicyagent/opa:1.0.0-static \
            eval --fail \
            -d /work/policies/security-policy-v1.rego \
            -i /work/gate-output/input.json \
            'data.securepipeline.gate.allow = true'

      - name: Guardar evidencia del gate
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: security-gate-${{ github.sha }}
          path: gate-output/
          retention-days: 14
          if-no-files-found: error

  approval:
    name: Aprobación de seguridad
    needs: sca
    if: ${{ needs.sca.outputs.needs_approval == 'true' }}
    runs-on: ubuntu-latest
    environment: security-approval
    steps:
      - run: echo "Aprobado por revisor de seguridad"

  package:
    name: Package
    needs: [sca, approval, security-gate]
    if: >-
      ${{
        !cancelled() &&
        needs.sca.result == 'success' &&
        needs.security-gate.result == 'success' &&
        (
          needs.approval.result == 'success' ||
          needs.approval.result == 'skipped'
        )
      }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Construir paquete
        run: |
          mkdir -p dist
          zip -r "dist/securebank-api-${{ github.sha }}.zip" \
            securebank_api requirements.txt README.md \
            -x "**/__pycache__/*"

      - name: Guardar paquete
        uses: actions/upload-artifact@v4
        with:
          name: dist-${{ github.sha }}
          path: dist/
          retention-days: 7
