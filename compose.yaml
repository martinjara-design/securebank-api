services:
  api:
    build: .
    ports:
      - "127.0.0.1:8080:8080"
    environment:
      SECUREBANK_JWT_SECRET: "${SECUREBANK_JWT_SECRET:?Debes definir SECUREBANK_JWT_SECRET}"
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
